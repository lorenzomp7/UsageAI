name: Build Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

# Un solo build per volta: un push nuovo annulla quello vecchio ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test e APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UsageAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UsageAI-android
          path: android/UsageAI.apk

      - name: Pubblica nella release «ultima-build»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima-build >/dev/null 2>&1 || \
            gh release create ultima-build --title "Ultima build" \
              --notes "APK e EXE aggiornati automaticamente a ogni push su main." || true
          gh release upload ultima-build UsageAI.apk --clobber
