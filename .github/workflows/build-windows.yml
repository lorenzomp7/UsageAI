name: Build Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/build-windows.yml"]
  pull_request:
    paths: ["windows/**"]
  workflow_dispatch:

permissions:
  contents: write

# Un solo build per volta: un push nuovo annulla quello vecchio ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Test
        run: python -m pytest -q tests

      - name: Crea UsageAI.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name UsageAI
          --icon assets/app.ico
          --collect-all curl_cffi
          --hidden-import pystray._win32
          --hidden-import keyring.backends.Windows
          main.py

      - name: Prova che l'exe parta
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\UsageAI.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "UsageAI.exe si è chiuso subito (exit $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "UsageAI.exe avviato correttamente"

      - uses: actions/upload-artifact@v4
        with:
          name: UsageAI-windows
          path: windows/dist/UsageAI.exe

      - name: Pubblica nella release «ultima-build»
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima-build >/dev/null 2>&1 || \
            gh release create ultima-build --title "Ultima build" \
              --notes "APK e EXE aggiornati automaticamente a ogni push su main." || true
          gh release upload ultima-build dist/UsageAI.exe --clobber
